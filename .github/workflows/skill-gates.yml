name: Skill Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill files
        run: python scripts/validate_skills.py

      - name: Validate skill catalog
        run: python scripts/build_skill_catalog.py --check
